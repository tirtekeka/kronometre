<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18:18 - 01:00 Kronometre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }
        
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff6b35;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 0 50px rgba(255, 107, 53, 0.3), 0 0 100px rgba(255, 107, 53, 0.1);
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 90%;
        }
        
        .title {
            color: #ff6b35;
            font-size: 1.5em;
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        .time-range {
            color: #ccc;
            font-size: 1.2em;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .time-value {
            background: #1a1a2e;
            border: 2px solid #ff6b35;
            border-radius: 10px;
            padding: 20px;
            min-width: 90px;
            font-size: 3em;
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
            font-weight: bold;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        .time-label {
            color: #ff6b35;
            margin-top: 10px;
            font-size: 0.9em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .separator {
            font-size: 3em;
            color: #ff6b35;
            display: flex;
            align-items: center;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .progress-bar {
            width: 100%;
            height: 5px;
            background: #1a1a2e;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
            border: 1px solid #333;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35, #ff4500);
            border-radius: 5px;
            transition: width 1s linear;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.8);
        }
        
        .status {
            color: #aaa;
            font-size: 0.9em;
            margin: 20px 0;
            letter-spacing: 1px;
        }
        
        .blink-text {
            animation: textBlink 2s infinite;
        }
        
        @keyframes textBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .completed-message {
            color: #4CAF50;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 20px;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
            display: none;
        }
        
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            position: relative;
            overflow: hidden;
        }
        
        .btn-ban-yedim {
            background: linear-gradient(45deg, #ff0000, #ff4444);
            color: white;
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            animation: pulse-red 2s infinite;
        }
        
        .btn-ban-yedim:hover {
            background: linear-gradient(45deg, #cc0000, #ff0000);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            transform: scale(1.05);
        }
        
        .btn-ban-yedim:active {
            transform: scale(0.95);
        }
        
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 0, 0.8); }
        }
        
        .btn-ban-yemedim {
            background: linear-gradient(45deg, #00cc00, #00ff00);
            color: white;
            border: 2px solid #00cc00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            animation: pulse-green 2s infinite;
        }
        
        .btn-ban-yemedim:hover {
            background: linear-gradient(45deg, #009900, #00cc00);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
            transform: scale(1.05);
        }
        
        .btn-ban-yemedim:active {
            transform: scale(0.95);
        }
        
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 0, 0.8); }
        }
        
        .message-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            display: none;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message-ban-yedim {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            color: #ff4444;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
        
        .message-ban-yemedim {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00ff00;
            color: #4CAF50;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        .vurgula {
            font-size: 1.3em;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">⏰ KRONOMETRE ⏰</div>
        <div class="time-range">18:18 → 01:00</div>
        
        <div class="countdown" id="countdown">
            <div class="time-block">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Saat</div>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Dakika</div>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Saniye</div>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress" id="progress" style="width: 0%"></div>
        </div>
        
        <div class="status blink-text" id="status">
            ⏳ Geri sayım devam ediyor...
        </div>
        
        <div class="completed-message" id="completedMessage">
            🎉 SÜRE DOLDU! Gece 01:00 oldu! 🎉
        </div>
        
        <div class="button-group">
            <button class="btn btn-ban-yedim" onclick="banYedim()">
                🚫 BAN YEDİM
            </button>
            <button class="btn btn-ban-yemedim" onclick="banYemedim()">
                ✅ BAN YEMEDİM
            </button>
        </div>
        
        <div class="message-box" id="messageBox"></div>
    </div>

    <script>
        function updateCountdown() {
            const now = new Date();
            
            // Hedef: Bugün gece 01:00
            let target = new Date(now);
            target.setHours(1, 0, 0, 0);
            
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            
            // 18:18 kontrolü
            if (currentHour > 18 || (currentHour === 18 && currentMinute >= 18)) {
                // 18:18'den sonra, hedef bugün gece 01:00 (yarın)
                target.setDate(target.getDate() + 1);
            } else if (currentHour < 1 || (currentHour === 1 && currentMinute === 0)) {
                // Gece 01:00'dan önce, hedef bugün gece 01:00
            } else {
                // 01:00 ile 18:18 arası, hedef yarınki 01:00
                target.setDate(target.getDate() + 1);
            }
            
            // Başlangıç zamanı: bugün 18:18
            let startTime = new Date(now);
            startTime.setHours(18, 18, 0, 0);
            
            if (currentHour < 18 || (currentHour === 18 && currentMinute < 18)) {
                startTime.setDate(startTime.getDate() - 1);
            }
            
            const totalDuration = target - startTime;
            const timeLeft = target - now;
            
            if (timeLeft <= 0) {
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('progress').style.width = '100%';
                document.getElementById('status').style.display = 'none';
                document.getElementById('completedMessage').style.display = 'block';
                document.querySelector('.countdown').style.display = 'none';
                document.querySelector('.title').textContent = '✅ SÜRE TAMAMLANDI ✅';
                return;
            }
            
            const hours = Math.floor(timeLeft / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
            
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            
            // Progress bar
            const elapsed = totalDuration - timeLeft;
            const percentage = (elapsed / totalDuration) * 100;
            document.getElementById('progress').style.width = percentage + '%';
            
            // Durum mesajı
            const statusElement = document.getElementById('status');
            if (hours > 0) {
                statusElement.textContent = `⏳ Gece 01:00'a ${hours} saat ${minutes} dakika ${seconds} saniye kaldı...`;
            } else {
                statusElement.textContent = `⏳ Gece 01:00'a ${minutes} dakika ${seconds} saniye kaldı...`;
            }
        }
        
        function banYedim() {
            const messageBox = document.getElementById('messageBox');
            messageBox.className = 'message-box message-ban-yedim';
            messageBox.innerHTML = '🚫 <span class="vurgula">Sıkıntı yok!</span> Çalışıyor, sen belli etmişsindir... 🤫';
            messageBox.style.display = 'block';
            
            // Mesajı 5 saniye sonra gizle
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 5000);
            
            // Buton efektleri
            const btn = document.querySelector('.btn-ban-yedim');
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
            }, 200);
        }
        
        function banYemedim() {
            const messageBox = document.getElementById('messageBox');
            messageBox.className = 'message-box message-ban-yemedim';
            messageBox.innerHTML = '🌟 <span class="vurgula">AFERİN!</span> İşte böyle devam, şimdi her şeyi kodlamaya başla butonu! 💪😎';
            messageBox.style.display = 'block';
            
            // Mesajı 5 saniye sonra gizle
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 5000);
            
            // Buton efektleri
            const btn = document.querySelector('.btn-ban-yemedim');
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
            }, 200);
        }
        
        // Hemen güncelle ve her saniye güncellemeye devam et
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
